<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gielinor Lo-Fi</title>
<style>
  :root { --bg: #16130f; --card: #221d17; --ink: #efe4d2; --dim: #a8987f; --accent: #e0a458; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 2.4rem; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--dim); margin: 0 0 32px; }
  .track { background: var(--card); border-radius: 10px; padding: 16px 18px; margin: 0 0 14px;
           border-left: 3px solid transparent; transition: border-color .2s; }
  .track.playing { border-left-color: var(--accent); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title { font-size: 1.15rem; font-weight: bold; }
  .meta { color: var(--dim); font-size: .85rem; font-family: ui-monospace, monospace; }
  .note { color: var(--dim); font-size: .92rem; margin: 6px 0 10px; }
  audio { width: 100%; height: 36px; }
  footer { color: var(--dim); font-size: .8rem; margin-top: 40px; border-top: 1px solid #3a3128; padding-top: 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Gielinor Lo-Fi</h1>
  <p class="sub">Old School RuneScape music, rebuilt as lo-fi from the original MIDIs. Work in progress.</p>

  <div id="tracks"></div>

  <footer>
    Fan reinterpretations of music by Ian Taylor / Jagex from Old School RuneScape. Non-commercial.
    Instruments from the GeneralUser GS soundfont; ambience synthesized.
    <a href="https://github.com/M4S4T0-V01D/gielinor-lofi">Source</a>
  </footer>
</main>
<script>
  const TRACKS = [
    ["harmony", "Harmony (Rainy Lumbridge)", "78 bpm · G minor", "Rain on the window, a boom-bap beat and a Rhodes under the Lumbridge theme."],
    ["autumn-voyage", "Autumn Voyage", "72 bpm · C# minor → A minor", "A rowing groove; a gust of wind carries the key change."],
    ["book-of-spells", "Book of Spells (Wizards' Tower)", "80 bpm · Bb dorian", "Jazz ride and sidestick in a dry tower room."],
    ["sea-shanty", "Sea Shanty (Port Sarim)", "12/8 · 76 bpm · D minor", "Waves, gulls, a ship's bell and a rolling deck."],
    ["castle-wars", "Castle Wars", "174 bpm · D# minor", "A 90s jungle departure: a chopped break wound up to tempo, dub sirens, orchestra hits and an 808 drop."],
    ["emotion", "Emotion (By the Hearth)", "84 bpm · Bb minor", "Brush kit and shaker by the fire; a held breath before the flute."],
    ["newbie-melody", "Newbie Melody (Tutorial Island)", "94 bpm · B mixolydian", "Birdsong and a bright kit; it starts on a tiny speaker and opens up when you step off the boat."],
    ["arabian", "Arabian (Al Kharid)", "72 bpm · Bb phrygian", "Ney, oud and darbuka over a half-time beat; crickets in the desert night."],
    ["fanfare", "Fanfare (Falador Park)", "116 bpm · Eb minor", "Dusty lo-fi house by the park fountain; halfway through, a marching band walks past."],
    ["gnomeball", "Gnomeball (Match Day)", "124 bpm · Bb major", "90s piano house at the Gnome Stronghold; a referee's whistle starts play, and a dropped ball bounces through the breakdown."],
    ["flute-salad", "Flute Salad (Italo)", "120 bpm · F# minor", "Italo piano house: the flute tune becomes a block-chord piano hook, and in the ocarina break the pads spin up through a rotary speaker."],
  ];
  const box = document.getElementById("tracks");
  TRACKS.forEach(([id, title, meta, note], i) => {
    const el = document.createElement("section");
    el.className = "track";
    el.innerHTML = `<div class="head"><span class="title">${String(i + 1).padStart(2, "0")} · ${title}</span>
      <span class="meta">${meta}</span></div><p class="note">${note}</p>
      <audio controls preload="none" src="audio/${id}.mp3"></audio>`;
    box.appendChild(el);
  });
  const players = [...document.querySelectorAll("audio")];
  players.forEach((a, i) => {
    a.addEventListener("play", () => {
      players.forEach(o => { if (o !== a) o.pause(); });
      document.querySelectorAll(".track").forEach(t => t.classList.remove("playing"));
      a.closest(".track").classList.add("playing");
    });
    a.addEventListener("ended", () => { if (players[i + 1]) players[i + 1].play(); });
  });
</script>
</body>
</html>
